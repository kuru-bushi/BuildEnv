<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Step11.DivIconのマーカーの表示|Lefletの基本|埼玉大学谷謙二研究室</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.0/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.3.0/dist/leaflet.js"></script>
  <style>
    /*紫色のアイコンのCSS  */
    .icon1 {
      width: 20px !important;
      height: 20px !important;
      border-radius: 10px;
      border: 3px solid #fdfdfd;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      background-color: rgb(204, 51, 166);
    }
    /*茶色のアイコンのCSS  */
    .icon2 {
      width: 20px !important;
      height: 20px !important;
      border-radius: 10px;
      border: 3px solid #fdfdfd;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      background-color: rgb(204, 125, 51);
    }


  /* ツールチップの本体（枠付き） */
  .icon2::before {
    content: attr(data-tooltip);
    position: absolute;
    visibility: hidden;
    opacity: 0;
    white-space: nowrap;
    background: #333;
    color: #fff;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #fff;
    z-index: 100;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    transition: opacity 0.2s;
  }

  /* 三角矢印 */
  .icon2::after {
    content: "";
    position: absolute;
    visibility: hidden;
    opacity: 0;
    border: 6px solid transparent;
    border-top-color: #333;
    z-index: 100;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    transition: opacity 0.2s;
  }

  /* ホバーで表示 */
  .icon2:hover::before,
  .icon2:hover::after {
    visibility: visible;
    opacity: 1;
  }
  </style>

  <script>
    function init() {
      var map = L.map('mapcontainer', { zoomControl: false });
      var input_api = [{
          "name": "テストネーム1",
          "mpoint": [35.6842, 139.7515],// 皇居の座標
          "ponp": [0,1,0],
        },
        {
            "name": "テストネーム2",
            "mpoint": [35.6850, 139.7645],// 大手町駅の座標
            "ponp": [0,1],
        },
      ];

      // loop ////////////////////////////////////////////////////////
      input_api.forEach(function(input) {
      console.log("--------");
      console.log(input["mpoint"]);

        map.setView(input["mpoint"], 15);
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
        }).addTo(map);

      //紫色のアイコンはアイコンの中央をアンカーに設定
      // EPSG:3857F
      //var myIcon1 = L.divIcon({ className: 'icon1', iconAnchor: [13, 13] });
      var myIcon2 = L.divIcon({ className: 'icon2', iconAnchor: [0, 0] });
      //茶色のアイコンはアイコンの左上をアンカーに設定
      L.marker(input["mpoint"], { icon: myIcon2 }).addTo(map);

      //マーカーに同じ地点にアイコンを設定して地図に追加
      // L.marker(input["mpoint"], { icon: myIcon1 }).addTo(map);

    });
    // loop ////////////////////////////////////////////////////////
    }
  </script>
</head>
<body onload="init()">
  <div id="mapcontainer" style="position:absolute;top:0;left:0;right:0;bottom:0;"></div>
</body>
 
</html>
